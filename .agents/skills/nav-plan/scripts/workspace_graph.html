<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><title>工作關係圖</title>
<style>
:root{--paper:#f7f5ef;--sheet:#fffdf9;--ink:#292721;--quiet:#79756b;--line:#dfdbd0;--accent:#835627;--tint:#ede4d4;--sans:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;--mono:ui-monospace,SFMono-Regular,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--sans)}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:6px 10px}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button[aria-pressed=true]{background:var(--tint);border-color:var(--accent)}header{padding:24px 28px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{font:11px var(--mono);letter-spacing:.12em;color:var(--quiet)}h1{font-size:24px;line-height:1.35;margin:7px 0 4px;letter-spacing:-.03em}header p{margin:0;color:var(--quiet);font-size:12px}.snapshot{text-align:right;white-space:nowrap;color:var(--quiet);font-size:11px}.tools{padding:14px 28px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}input{min-width:180px;flex:1;max-width:380px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:7px 11px}.tools label{font-size:12px;color:var(--quiet)}.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;min-height:calc(100vh - 188px)}.catalog{border-right:1px solid var(--line);padding:16px 12px;max-height:calc(100vh - 188px);overflow:auto}.count{position:sticky;top:0;background:var(--paper);padding:7px 0;z-index:1;margin:0 8px 12px;color:var(--quiet);font-size:12px}.record{display:block;width:100%;text-align:left;padding:11px 10px;border:0;border-radius:5px;background:transparent;margin:0 0 3px}.record[aria-current=true]{background:var(--tint);box-shadow:inset 2px 0 var(--accent)}.record .name{display:block;font-size:13px;font-weight:550;line-height:1.5;overflow-wrap:anywhere}.meta{font-size:10px;color:var(--quiet);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}.kind{text-transform:uppercase;font-family:var(--mono);letter-spacing:.03em}.map{min-width:0;position:relative;overflow:hidden}.map-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px 18px;border-bottom:1px solid var(--line);font-size:11px;color:var(--quiet)}.map-top div{display:flex;gap:4px}.map-top button{padding:2px 8px}.canvas{height:calc(100vh - 246px);min-height:310px;overflow:auto;background-image:radial-gradient(#d9d5ca .7px,transparent .7px);background-size:20px 20px}svg{display:block}.node{cursor:pointer}.node rect{fill:var(--sheet);stroke:var(--line);stroke-width:1}.node.selected rect{fill:var(--tint);stroke:var(--accent);stroke-width:1.6}.node:hover rect{stroke:var(--accent)}.node text{fill:var(--ink);font-family:var(--sans);font-size:11px;pointer-events:none}.node .node-meta{fill:var(--quiet);font-family:var(--mono);font-size:9px}.edge{fill:none;stroke:#b8ac98;stroke-width:1.15}.edge-label{fill:#8b7c64;font:8px var(--mono);paint-order:stroke;stroke:var(--paper);stroke-width:3px}.column{fill:var(--quiet);font:10px var(--mono);letter-spacing:.1em}.detail{border-left:1px solid var(--line);padding:20px;max-height:calc(100vh - 188px);overflow:auto;background:var(--sheet)}.detail h2{font-size:18px;line-height:1.45;margin:12px 0}.detail h3{font-size:11px;letter-spacing:.08em;color:var(--quiet);margin:24px 0 8px}.detail .path{font:10px/1.6 var(--mono);overflow-wrap:anywhere;color:var(--quiet)}.summary{overflow-wrap:anywhere;white-space:pre-line;font-size:13px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.relation{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:0;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.relation span{display:block;color:var(--quiet);font:10px var(--mono);margin-bottom:3px}.dates{font-size:11px;color:var(--quiet)}details{margin-top:22px}summary{cursor:pointer;font-size:12px;color:var(--accent)}pre{font:11px/1.7 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:14px}.empty{padding:30px 18px;color:var(--quiet);font-size:13px}.notice{padding:10px 28px;background:#f2e8d6;font-size:12px}.hidden{display:none!important}.detail-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.detail-actions button{font-size:11px}.tiny{font-size:10px;color:var(--quiet)}
@media(max-width:1100px){.layout{grid-template-columns:205px minmax(0,1fr) 285px}header,.tools{padding-left:20px;padding-right:20px}.detail{padding:16px}}
@media(max-width:720px){header{padding:18px 16px;align-items:start}h1{font-size:20px}.snapshot{font-size:10px}.tools{padding:12px 16px}input{max-width:none;min-width:100%;}.layout{grid-template-columns:150px minmax(0,1fr)}.catalog{max-height:410px;padding:10px 5px}.canvas{height:360px;min-height:0}.map-top{padding:10px;align-items:start}.map-top>span{max-width:120px}.detail{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:none}.detail h2{max-width:600px}.layout{min-height:0}.record{padding:9px 7px}.record .name{font-size:12px}.count{position:sticky;top:0;background:var(--paper);padding:7px 0;z-index:1;margin:0 5px 10px}.notice{padding:10px 16px}}
</style>
</head>
<body>
<header><div><div class="eyebrow">WORKSPACE / RELATIONS</div><h1 id="project-title">工作關係圖</h1><p>從一件工作，找到它的理由、驗證與下一步。</p></div><div class="snapshot">唯讀快照<br><span id="generated"></span></div></header>
<div class="tools"><input id="search" type="search" placeholder="搜尋標題、內容或 ID" aria-label="搜尋紀錄"><label for="type">類型</label><select id="type"><option value="all">所有類型</option></select><label for="state">狀態</label><select id="state"><option value="all">全部</option><option value="active">進行／暫停中</option><option value="saved">先存著</option><option value="unverified">尚未核對</option><option value="closed">已結束</option></select><button id="focus" aria-pressed="true">只看相關</button><button id="reset">重設</button></div>
<div id="notice" class="notice hidden" role="status"></div>
<main class="layout"><nav class="catalog" aria-label="工作紀錄"><p id="count" class="count"></p><div id="list"></div></nav><section class="map" aria-label="關係地圖"><div class="map-top"><span id="map-caption">線條來自紀錄中的實際關聯</span><div><button id="minus" aria-label="縮小">−</button><button id="plus" aria-label="放大">＋</button></div></div><div id="canvas" class="canvas"><svg id="graph" role="group" aria-label="工作關係圖"></svg></div></section><aside id="detail" class="detail" aria-label="紀錄詳情"></aside></main>
<script id="workspace-data" type="application/json">/*__WORKSPACE_DATA__*/null</script>
<script>
'use strict';
const data=JSON.parse(document.querySelector('#workspace-data').textContent);
const $=s=>document.querySelector(s), NS='http://www.w3.org/2000/svg';
const records=data.records, byId=new Map(records.map(r=>[r.id,r]));
const kinds={idea:'想法',thought:'思考／決定',mockup:'畫面比較',probe:'實驗驗證',task:'工作',plan:'實作計畫'};
const statusText={saved:'先存著',exploring:'探索中',closed:'已結束',draft:'草稿',adopted:'已採用',shelved:'暫擱',superseded:'已取代',selected:'已選定',planned:'待開始',active:'進行中',concluded:'已結束',paused:'暫停',blocked:'受阻',done:'已完成',cancelled:'已取消',completed:'已完成',unverified:'尚未核對'};
const measure=document.createElement('canvas').getContext('2d');measure.font='11px '+getComputedStyle(document.body).fontFamily;
function lines(title){const result=[''];for(const char of String(title)){let i=result.length-1;if(measure.measureText(result[i]+char).width>156){if(i===1){result[i]=result[i].slice(0,-1)+'…';break}result.push(char)}else result[i]+=char}return result}
const edges=data.graph.edges, order=Object.keys(kinds);let selected=(data.project.priorities||[]).find(x=>byId.has(x))||records.find(r=>r.type==='task'&&r.status==='active')?.id||records[0]?.id;
let focus=true,scale=1;
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function svg(tag,attrs,text){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs||{}))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function state(r){if($('#state').value==='all')return true;return ({active:['active','paused','blocked'],saved:['saved','shelved'],unverified:['unverified'],closed:['closed','superseded','concluded','done','cancelled','completed']})[$('#state').value].includes(r.status)}
function filtered(){const q=$('#search').value.trim().toLocaleLowerCase();return records.filter(r=>($('#type').value==='all'||r.type===$('#type').value)&&state(r)&&(!q||[r.title,r.id,r.body].join(' ').toLocaleLowerCase().includes(q)))}
function neighbors(id){const ids=new Set([id]);for(const e of edges){if(e.source===id)ids.add(e.target);if(e.target===id)ids.add(e.source)}return ids}
function choose(id){selected=id;render()}
function render(){const visible=filtered();if(!visible.some(r=>r.id===selected))selected=visible[0]?.id;
 $('#count').textContent=`${visible.length} / ${records.length} 份紀錄`;
 const list=$('#list');list.replaceChildren();for(const r of visible){const b=el('button','record');b.setAttribute('aria-current',String(r.id===selected));b.dataset.id=r.id;b.append(el('span','name',r.title));const m=el('span','meta');m.append(el('span','kind',r.type),el('span','',statusText[r.status]||String(r.status)));b.append(m);b.onclick=()=>choose(r.id);list.append(b)}
 if(!visible.length)list.append(el('p','empty','沒有符合的紀錄。試試清除篩選。'));
 const current=list.querySelector('[aria-current="true"]');if(current){const a=current.getBoundingClientRect(),b=list.parentElement.getBoundingClientRect();if(a.top<b.top+45||a.bottom>b.bottom)list.parentElement.scrollTop+=a.top-b.top-55}
 draw(visible);detail();$('#detail').scrollTop=0;$('#focus').setAttribute('aria-pressed',String(focus));
}
function draw(visible){const near=neighbors(selected),nodes=focus?visible.filter(r=>near.has(r.id)):visible,ids=new Set(nodes.map(r=>r.id));
 const linked=edges.filter(e=>ids.has(e.source)&&ids.has(e.target)),positions=new Map();const columns=focus?order.filter(type=>nodes.some(r=>r.type===type)):order;const width=Math.max(1,columns.length)*215+40;let height=340;
 const root=$('#graph');root.replaceChildren();const defs=svg('defs');const marker=svg('marker',{id:'arrow',markerWidth:7,markerHeight:7,refX:6,refY:3.5,orient:'auto'});marker.append(svg('path',{d:'M0,0 L7,3.5 L0,7 Z',fill:'#b8ac98'}));defs.append(marker);root.append(defs);
 columns.forEach((type,col)=>{root.append(svg('text',{x:25+col*215,y:28,class:'column'},`${kinds[type]} / ${type}`));const group=nodes.filter(r=>r.type===type);group.forEach((r,row)=>positions.set(r.id,{x:20+col*215,y:52+row*90}));height=Math.max(height,group.length*90+80)});
 for(const e of linked){const a=positions.get(e.source),b=positions.get(e.target);if(!a||!b)continue;let x1=a.x+180,y1=a.y+32,x2=b.x,y2=b.y+32;let d=x1<x2?`M${x1},${y1} C${x1+50},${y1} ${x2-50},${y2} ${x2},${y2}`:`M${x1},${y1} C${x1+28},${y1} ${x1+28},${y2} ${b.x+180},${y2}`;
 const p=svg('path',{d,class:'edge','marker-end':'url(#arrow)'});p.append(svg('title',{},e.relation));root.append(p);root.append(svg('text',{x:(x1+(x1<x2?x2:b.x+180))/2,y:(y1+y2)/2-5,class:'edge-label'},e.relation))}
 for(const r of nodes){const pos=positions.get(r.id);if(!pos)continue;const g=svg('g',{class:'node'+(r.id===selected?' selected':''),transform:`translate(${pos.x},${pos.y})`,tabindex:0,role:'button','aria-label':r.title+'，'+(statusText[r.status]||r.status),'data-id':r.id});g.append(svg('rect',{width:180,height:65,rx:5}));const title=String(r.title);lines(title).forEach((line,i)=>g.append(svg('text',{x:10,y:20+i*16},line)));g.append(svg('text',{x:10,y:54,class:'node-meta'},statusText[r.status]||String(r.status)));g.append(svg('title',{},title));g.onclick=()=>choose(r.id);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(r.id)}};root.append(g)}
 if(!nodes.length)root.append(svg('text',{x:30,y:90,fill:'#79756b'},'沒有可顯示的關聯。'));
 root.setAttribute('viewBox',`0 0 ${width} ${height}`);root.setAttribute('width',width*scale);root.setAttribute('height',height*scale);
 const at=positions.get(selected),canvas=$('#canvas');if(at){canvas.scrollLeft=Math.max(0,(at.x+90)*scale-canvas.clientWidth/2);canvas.scrollTop=Math.max(0,at.y*scale-70)}
 $('#map-caption').textContent=`${nodes.length} 筆・${linked.length} 條關聯；類型不是必經流程`;
}
function detail(){const box=$('#detail');box.replaceChildren();const r=byId.get(selected);if(!r){box.append(el('p','empty','選一份紀錄，從它的關係開始。'));return}
 box.append(el('div','eyebrow',`${r.type} / ${statusText[r.status]||r.status}`),el('h2','',r.title));
 const meta=r.metadata||r;box.append(el('p','dates',`建立 ${meta.created||'未知'}　更新 ${meta.updated||'未知'}`));
 const body=String(r.body||'');const intro=body.split(/^## /m)[0].split('\n').filter(l=>l.startsWith('>')).slice(0,3).map(l=>l.replace(/^>\s?/,'' )).join('\n');if(intro)box.append(el('p','summary',intro));
 box.append(el('h3','','原始紀錄'),el('div','path',r.path));const actions=el('div','detail-actions'),copy=el('button','','複製位置'),download=el('button','','下載文字');copy.onclick=async()=>{try{await navigator.clipboard.writeText(r.path);copy.textContent='已複製'}catch{copy.textContent='請選取上方位置'}};download.onclick=()=>{const a=el('a');const url=URL.createObjectURL(new Blob([body],{type:'text/markdown;charset=utf-8'}));a.href=url;a.download=String(r.id).replace(/[^a-zA-Z0-9_-]/g,'_')+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};actions.append(copy,download);box.append(actions);
 box.append(el('h3','','關聯紀錄'));const rs=edges.filter(e=>e.source===r.id||e.target===r.id);for(const edge of rs){const out=edge.source===r.id,id=out?edge.target:edge.source,target=byId.get(id);const b=el('button','relation');b.append(el('span','',`${out?'→':'←'} ${edge.relation}`),el('strong','',target?.title||String(id)));if(target)b.onclick=()=>{ $('#search').value='';$('#type').value='all';$('#state').value='all';choose(id)};else b.disabled=true;box.append(b)}if(!rs.length)box.append(el('p','tiny','還沒有記錄關聯；不補造不存在的連結。'));
 const more=el('details'),label=el('summary','','展開完整紀錄'),text=el('pre','',body);more.append(label,text);box.append(more);box.append(el('p','tiny','這是匯出當時的唯讀快照；進度仍寫回原紀錄。'));
}
$('#project-title').textContent=data.project.title||data.project.id;$('#generated').textContent=data.generated.replace('T',' ').replace('+00:00',' UTC');for(const [key,label] of Object.entries(kinds)){const o=el('option','',label);o.value=key;$('#type').append(o)}
if(data.graph.diagnostics.length){$('#notice').classList.remove('hidden');$('#notice').textContent=`讀到 ${data.graph.diagnostics.length} 個資料問題；以下顯示可讀內容，不能視為完整檢查通過。`}
for(const id of ['search','type','state'])$('#'+id).addEventListener(id==='search'?'input':'change',render);
$('#focus').onclick=()=>{focus=!focus;render()};$('#reset').onclick=()=>{$('#search').value='';$('#type').value='all';$('#state').value='all';focus=true;scale=1;selected=(data.project.priorities||[]).find(x=>byId.has(x))||records[0]?.id;render()};$('#plus').onclick=()=>{scale=Math.min(1.8,scale+.15);draw(filtered())};$('#minus').onclick=()=>{scale=Math.max(.55,scale-.15);draw(filtered())};render();
</script>
</body></html>
