<header><div class="brand">workspace <small>WORK IN CONTEXT</small></div><div class="utility"><span class="snapshot-label">唯讀快照</span><button class="btn" id="search-toggle" aria-expanded="false">搜尋紀錄</button></div></header><div id="notice" class="notice hidden" role="status"></div>

<nav class="tabs" aria-label="工作區檢視"><button data-view="now" class="on">目前工作</button><button data-view="ideas">想法庫</button><button data-view="graph">工作脈絡</button><button data-view="review">待核對<span id="review-count" class="tab-count"></span></button><button data-view="closed">已結束</button></nav><div class="layout" id="layout"><section class="content" id="content"></section><aside class="detail hidden" id="detail" aria-label="紀錄詳情"></aside></div><footer><span>進度與決定仍寫回原紀錄；這份畫面只反映匯出時的狀態。</span><span id="generated"></span></footer></main></div>

<script>
'use strict';
const data=JSON.parse(document.querySelector('#workspace-data').textContent),$=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
const kinds={idea:'Idea · 想法',thought:'Thought · 推演草稿',doc:'Doc · 保留文件',mockup:'Mockup · 畫面比較',probe:'Probe · 實驗驗證',task:'Task · 任務',plan:'Plan · 舊計畫'},states={saved:'先存著',exploring:'探索中',closed:'已結束',draft:'草稿',current:'目前適用',adopted:'已採用',shelved:'暫擱',superseded:'已取代',selected:'已選定',planned:'待開始',active:'進行中',concluded:'實驗結束',paused:'暫停',blocked:'受阻',done:'已完成',cancelled:'已取消',completed:'已完成',unverified:'尚未核對'},relNames={explored_by:'探索稿',extends:'延伸',tests:'驗證',implements:'落實',supported_by:'依據',references:'參考／提及',supersedes:'取代',superseded_by:'已由此取代',blocked_by:'受阻於'},flagNames={unverified:'來源狀態待核對',unlinked_work:'關聯待檢查',superseded:'已取代，核對理由',working_draft:'推演已結束，待核對移轉'};
const records=data.records.map(r=>({...r,_key:r.path,_project:r.project_selector||String(r.project),_title:typeof r.title==='string'&&r.title.trim()?r.title:r.path.split('/').pop()}));const byPath=new Map(records.map(r=>[r.path,r]));let project=data.project.selector||String(data.project.id),view=location.hash.startsWith('#graph')?'graph':'now',selected=null,detailOpen=false,searchOpen=false,reviewFilter='unverified',scale=1,includeClosed=false,fitGraph=true;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const projectKey=p=>p.selector||String(p.id);const p=()=>data.projects.find(x=>projectKey(x)===project)||data.project;const list=()=>records.filter(r=>r._project===project);const edges=()=>data.graphs[project]?.edges||[];const review=()=>data.reviews[project]||{counts:{},candidates:[],observation_tasks:[]};
function idRecord(id){const a=list().filter(r=>typeof r.id==='string'&&r.id===id);return a.length===1?a[0]:null}function current(){return byPath.get(selected)}function state(r){if(r.type==='mockup'&&r.status==='superseded')return '已退役';return typeof r.status==='string'?(states[r.status]||r.status):'狀態待核對'}function isClosed(r){return ['done','completed','closed','cancelled','superseded'].includes(r.status)}function opening(r){const section=String(r.body||'').split(/^## /m)[0];const quote=section.split('\n').filter(l=>l.startsWith('>')).slice(0,3).map(l=>l.replace(/^>\s?/,'' )).join(' ');return quote||String(r.body||'').split('\n').find(l=>l.trim()&&!l.startsWith('#'))||''}function focusDefault(){const linked=location.hash.startsWith('#graph/')?idRecord(decodeURIComponent(location.hash.slice(7))):null;selected=linked?._key||p().priorities.map(idRecord).find(Boolean)?._key||list().find(r=>r.type==='task'&&r.status==='active')?._key||list()[0]?._key||null}
function formatStamp(value){if(typeof value!=='string'||!value.trim())return '未知';if(/^\d{4}-\d{2}-\d{2}$/.test(value))return value;if(!/^\d{4}-\d{2}-\d{2}T.*(?:Z|[+-]\d{2}:?\d{2})$/.test(value))return '未知';const date=new Date(value);return Number.isNaN(date.getTime())?'未知':new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(date)+' 台北'}
function recordTime(r,full=false){const m=r.metadata||{},created=formatStamp(m.created||m.created_at),updated=formatStamp(m.updated||m.updated_at);if(full)return `<div class="record-dates"><span>建立 ${esc(created)}</span><span>更新 ${esc(updated)}</span></div>`;return `<span class="record-time" title="${esc('建立 '+created+' · 更新 '+updated)}">更新 ${esc(updated)}</span>`}
function previewLink(r,label,classes='btn'){const value=r.type==='mockup'?r.metadata?.preview_url:null;if(typeof value!=='string')return '';try{const url=new URL(value);if(!['http:','https:'].includes(url.protocol))return '';return `<a class="${esc(classes)}" href="${esc(url.href)}" target="_blank" rel="noopener noreferrer" title="開啟 Mockup 畫面">${esc(label)}</a>`}catch{return ''}}

function choose(path){const record=byPath.get(path);if(!record)return;project=record._project;selected=path;detailOpen=true;fitGraph=true;render()}
function searchActive(){return searchOpen&&($('#search').value.trim()||$('#search-type').value!=='all'||$('#search-state').value!=='all')}
function searchResults(){const q=$('#search').value.trim().toLocaleLowerCase(),type=$('#search-type').value,status=$('#search-state').value;return list().filter(r=>(type==='all'||r.type===type)&&(!q||[r._title,r.id,r.body,r.path].join(' ').toLocaleLowerCase().includes(q))&&(status==='all'||({active:['active','paused','blocked'],saved:['saved','shelved'],unverified:['unverified'],closed:['done','completed','closed','cancelled','superseded']})[status].includes(r.status)))}
function render(){const projectData=p();$('#project-title').textContent=projectData.title||String(projectData.id);$('#project-times').innerHTML=recordTime(projectData,true);const counts=review().counts;$('#review-count').textContent=counts.unverified||'';$('#project-caption').textContent=view==='graph'?'從一件工作，追它的來處與後續。':view==='review'?'先核對，再決定保留、合併或移除。':'原 task 留下進度、理由與下一步。';const many=data.projects.length>1;$('#shell').classList.toggle('single',!many);$('#projects').classList.toggle('hidden',!many);$('#projects').innerHTML='<div class="projects-label">我的專案</div>'+data.projects.map(x=>`<button class="${projectKey(x)===project?'on':''}" data-project="${esc(projectKey(x))}">${esc(x.title||x.id)}${recordTime(x)}</button>`).join('');document.querySelectorAll('.tabs [data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===view));let html='';const rows=list(),searching=searchActive();$('#layout').classList.toggle('graph-mode',view==='graph'&&!searching);$('#layout').classList.toggle('has-detail',detailOpen&&!!current());
if(searching){const matches=searchResults();html=`<div class="section-title">找到 ${matches.length} 份紀錄</div>`+(matches.map(r=>card(r,true)).join('')||'<p class="empty">沒有符合的紀錄。</p>')}
else if(view==='now'){const rank=new Map(p().priorities.map((id,i)=>[id,i]));const tasks=rows.filter(r=>r.type==='task'&&['active','paused','blocked','planned'].includes(r.status)).sort((a,b)=>(rank.get(a.id)??999)-(rank.get(b.id)??999));html=`<div class="section-title">承諾中的工作 · ${tasks.length}</div>`+(tasks.map(r=>card(r)).join('')||'<p class="empty">目前沒有已確認的交付。</p>');const unknown=rows.filter(r=>r.type==='task'&&r.status==='unverified');if(unknown.length)html+=`<details><summary>尚未核對的舊工作 · ${unknown.length}</summary>${unknown.map(r=>card(r,true)).join('')}</details>`;const docs=rows.filter(r=>r.type==='doc'&&r.status!=='superseded');if(docs.length)html+='<h3>保留文件 · 知識與限制</h3>'+docs.map(r=>card(r,true)).join('');const adopted=rows.filter(r=>r.type==='thought'&&r.status==='adopted');if(adopted.length)html+='<h3>舊決策 · 尚未分類至文件</h3>'+adopted.map(r=>card(r,true)).join('')}
else if(view==='ideas'){const ideas=rows.filter(r=>r.type==='idea'&&!isClosed(r)||r.type==='thought'&&r.status==='shelved');html='<div class="section-title">保存理由與重訪時機，不自動增加待辦。</div>'+(ideas.map(r=>card(r)).join('')||'<p class="empty">目前沒有暫存的想法。</p>')}

else if(view==='review'){html='<div class="review-tabs">'+Object.entries(flagNames).map(([k,title])=>`<button data-review="${k}" class="${reviewFilter===k?'on':''}">${title} · ${counts[k]||0}</button>`).join('')+'</div>';const candidates=review().candidates.filter(r=>r.flags.includes(reviewFilter));html+='<p class="quiet">待核對不是可刪除；沒有關聯也不自動補造父項目。</p>'+ (candidates.map(x=>byPath.has(x.path)?card(byPath.get(x.path),true,x.flags):'').join('')||'<p class="empty">這一類目前沒有候選。</p>')}
else if(view==='closed'){html='<div class="section-title">已結束不等於可刪除；tidy 會核對過期內容，保留有用的理由與證據。</div>'+(rows.filter(isClosed).map(r=>card(r,true)).join('')||'<p class="empty">尚無已確認結束的工作。</p>');const probes=rows.filter(r=>r.type==='probe'&&r.status==='concluded');if(probes.length)html+='<h3>已結束的驗證 · 結論與限制保留</h3>'+probes.map(r=>card(r,true)).join('')}
$('#content').innerHTML=html;$('#layout').classList.toggle('graph-mode',view==='graph'&&!searching);$('#layout').classList.toggle('has-detail',detailOpen&&!!current());$('#detail').classList.toggle('hidden',!detailOpen||!current());if(detailOpen)detail();bind();const allDiagnostics=Object.values(data.graphs).flatMap(x=>x.diagnostics||[]);$('#notice').classList.toggle('hidden',!allDiagnostics.length);$('#notice').textContent=`讀到 ${allDiagnostics.length} 個資料問題；仍顯示可讀內容，需回原紀錄核對。`}
// Focus graph: only direct relations are drawn, in balanced columns around the selected record.
// Details use a separate column; the map's natural layout fits both dimensions before zoom.
function graph(){
const root=current();if(!root)return '<p class="empty">沒有可顯示的紀錄。</p>';
const es=edges().filter(e=>e.source===root.id||e.target===root.id),ids=new Set(es.flatMap(e=>[e.source,e.target]));
const neighbors=list().filter(r=>r!==root&&typeof r.id==='string'&&idRecord(r.id)===r&&ids.has(r.id)&&(includeClosed||!isClosed(r)||r.type==='mockup'));
const left=[],right=[];
neighbors.sort((a,b)=>a._title.localeCompare(b._title)).forEach((r,i)=>(i%2?right:left).push(r));
const available=$('#layout').clientWidth-(detailOpen&&innerWidth>1000?320:0),width=Math.max(580,available);
const margin=24,gap=52,cardW=Math.min(220,(width-margin*2-gap*2)/3),cardH=108,rowGap=18,top=40;
const count=Math.max(1,left.length,right.length),height=Math.max(360,top+count*(cardH+rowGap)+6);
const pos=new Map([[root._key,{x:(width-cardW)/2,y:top+(count-1)*(cardH+rowGap)/2}]]);
for(const [items,x] of [[left,margin],[right,width-margin-cardW]])items.forEach((r,i)=>pos.set(r._key,{x,y:top+i*(cardH+rowGap)}));
const canvasHeight=Math.max(420,Math.min(innerHeight*.65,580));
if(fitGraph)scale=Math.min(1,available/width,(canvasHeight-16)/height);
const center=pos.get(root._key);let lines='';
for(const other of neighbors){
 const a=pos.get(other._key),onLeft=left.includes(other),x1=center.x+(onLeft?0:cardW),x2=a.x+(onLeft?cardW:0),y1=center.y+cardH/2,y2=a.y+cardH/2,lane=(x1+x2)/2;
 const relations=es.filter(e=>e.source===other.id||e.target===other.id),out=relations.some(e=>e.source===root.id),incoming=relations.some(e=>e.target===root.id);
 const label=[...new Set(relations.map(e=>relNames[e.relation]||e.relation))].join(' · ');
 const path=`M${x1},${y1} C${lane},${y1} ${lane},${y2} ${x2},${y2}`;
 lines+=`<g><title>${esc(root._title)} — ${esc(other._title)}: ${esc(label)}</title><path class="edge" d="${path}" ${out?'marker-end="url(#arrow)"':''} ${incoming?'marker-start="url(#arrow)"':''}/></g>`;
}
const nodes=[root,...neighbors].map(r=>{const a=pos.get(r._key);return `<g class="node ${r===root?'on':''}" data-record="${esc(r._key)}" tabindex="0" role="button" aria-label="${esc(r._title)}"><rect x="${a.x}" y="${a.y}" width="${cardW}" height="${cardH}" rx="7"/><foreignObject x="${a.x+13}" y="${a.y+12}" width="${cardW-26}" height="${cardH-22}"><div xmlns="http://www.w3.org/1999/xhtml" class="canvas-card ${neighbors.length>6?'dense':''}"><div class="kind"><b>${previewLink(r,(kinds[r.type]||'紀錄')+' ↗','preview-link')||esc(kinds[r.type]||'紀錄')}</b><span>${esc(state(r))}</span></div><h4>${esc(r._title)}</h4>${recordTime(r)}</div></foreignObject><title>${esc(r._title)}</title></g>`}).join('');
return `<div class="canvas"><span class="map-note">直接關聯 · ${neighbors.length} 份</span><div class="canvas-scroll" id="canvas-scroll"><svg class="graph" style="width:${width*scale}px;height:${height*scale}px;margin:0 auto" viewBox="0 0 ${width} ${height}" aria-label="可點選的工作脈絡"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path class="edge-arrow" d="M1,1 L5,3 L1,5 Z"/></marker></defs>${lines}${nodes}</svg></div><div class="dock"><button id="zoom-out" aria-label="縮小">−</button><button id="zoom-reset">${Math.round(scale*100)}%</button><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-fit">適合視窗</button></div></div><div class="legend"><span>選取紀錄，查看它的直接關係。</span><label><input id="include-closed" type="checkbox" ${includeClosed?'checked':''}>其他已結束紀錄</label></div>`}
function inline(text,owner){const slots=[];let s=String(text).replace(/`([^`]+)`/g,(_,code)=>{const i=slots.push('<code>'+esc(code)+'</code>')-1;return '\uE000'+i+'\uE001'});s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,target)=>{let html='<span class="local-link" title="'+esc(target)+'">'+esc(label)+'</span>';try{const url=new URL(target,'https://workspace.invalid/'+owner.path);if(url.hostname==='workspace.invalid'){const dest=byPath.get(decodeURIComponent(url.pathname.slice(1)));if(dest)html='<button class="local-link" data-record="'+esc(dest._key)+'">'+esc(label)+'</button>'}else if(['http:','https:'].includes(url.protocol))html='<a href="'+esc(url.href)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>'}catch{}const i=slots.push(html)-1;return '\uE000'+i+'\uE001'});return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\uE000(\d+)\uE001/g,(_,i)=>slots[Number(i)]||'')}
function markdown(text,owner){const lines=String(text).split('\n');let html='',i=0;while(i<lines.length){let l=lines[i];if(!l.trim()){i++;continue}if(/^```/.test(l)){let code=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))code.push(lines[i++]);i++;html+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';continue}const h=l.match(/^(#{1,6})\s+(.+)$/);if(h){const level=Math.min(5,h[1].length+1);html+=`<h${level}>${inline(h[2],owner)}</h${level}>`;i++;continue}if(/^\s*<!--/.test(l)){i++;continue}if(l.startsWith('|')&&i+1<lines.length&&/^\|[\s:|-]+\|/.test(lines[i+1])){const head=l.split('|').slice(1,-1);i+=2;let rows='';while(i<lines.length&&lines[i].startsWith('|'))rows+='<tr>'+lines[i++].split('|').slice(1,-1).map(c=>'<td>'+inline(c.trim(),owner)+'</td>').join('')+'</tr>';html+='<div class="table-wrap"><table><thead><tr>'+head.map(c=>'<th>'+inline(c.trim(),owner)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';continue}if(/^\s*[-*]\s+/.test(l)||/^\s*\d+\.\s+/.test(l)){const ordered=/^\s*\d+\./.test(l);let items='';const re=ordered?/^\s*\d+\.\s+/:/^\s*[-*]\s+/;while(i<lines.length&&re.test(lines[i]))items+='<li>'+inline(lines[i++].replace(re,''),owner)+'</li>';html+=(ordered?'<ol>':'<ul>')+items+(ordered?'</ol>':'</ul>');continue}if(l.startsWith('>')){html+='<blockquote>'+inline(l.replace(/^>\s?/,''),owner)+'</blockquote>';i++;continue}let paragraph=[l];i++;while(i<lines.length&&lines[i].trim()&&!/^(#|>|```|\s*[-*]\s+|\s*\d+\.\s+|\|)/.test(lines[i]))paragraph.push(lines[i++]);html+='<p>'+inline(paragraph.join(' '),owner)+'</p>'}return html}
function detail(){const r=current();if(!r)return;const body=String(r.body||''),obs=body.match(/^##\s+(?:Observations|觀察)[^\n]*\n([\s\S]*?)(?=^##\s|(?![\s\S]))/mi);const related=Array.from(edges().filter(e=>e.source===r.id||e.target===r.id).reduce((groups,e)=>{const out=e.source===r.id,id=out?e.target:e.source,entry=groups.get(id)||{id,labels:[]},label=(out?'→':'←')+' '+(relNames[e.relation]||e.relation);if(!entry.labels.includes(label))entry.labels.push(label);groups.set(id,entry);return groups},new Map()).values());$('#detail').innerHTML=`<div class="detail-head"><div class="record-meta"><span class="kind">${esc(kinds[r.type]||'類型待核對')}</span><span class="state">${esc(state(r))}</span></div><button id="close-detail" aria-label="關閉詳情">×</button></div><h2>${esc(r._title)}</h2>${recordTime(r,true)}<p class="lead">${esc(opening(r))}</p><div class="actions">${previewLink(r,'開啟畫面 ↗')}<button class="btn" id="show-context">看工作脈絡</button></div>${obs?'<section class="observations"><h3>觀察到的現象</h3><div class="md">'+markdown(obs[1],r)+'</div></section>':''}<h3>關聯紀錄</h3>${related.map(e=>{const other=idRecord(e.id);return `<button class="relation" ${other?'data-record="'+esc(other._key)+'"':'disabled'}><small>${esc(other?kinds[other.type]||'類型待核對':'類型待核對')}<br>${esc(e.labels.join(' · '))}</small>${esc(other?other._title:String(e.id))}${other?recordTime(other):''}</button>`}).join('')||'<p class="quiet">尚未記錄關聯。</p>'}<details id="full-record"><summary>完整紀錄</summary><div class="md" id="record-body"></div></details><details><summary>來源與識別</summary><p class="source">${esc(r.path)}</p><p class="source">ID ${esc(typeof r.id==='string'?r.id:'待核對')}${r.metadata?.imported?'<br>匯入 '+esc(formatStamp(r.metadata.imported)):''}${r.metadata?.restored?'<br>恢復連結 '+esc(formatStamp(r.metadata.restored)):''}</p><button class="btn" id="copy-path">複製位置</button></details>`;$('#full-record').addEventListener('toggle',e=>{if(e.currentTarget.open&&!$('#record-body').hasChildNodes()){ $('#record-body').innerHTML=markdown(body,r);bindRecords($('#record-body'))}})}
function bindRecords(root=document){root.querySelectorAll('[data-record]').forEach(b=>{b.onclick=e=>{if(e.target.closest('a'))return;choose(b.dataset.record)};if(b.tagName.toLowerCase()==='g')b.onkeydown=e=>{if(e.target.closest('a'))return;if(['Enter',' '].includes(e.key)){e.preventDefault();choose(b.dataset.record)}}})}
function bind(){document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{project=b.dataset.project;view='now';detailOpen=false;scale=1;includeClosed=false;$('#search').value='';$('#search-type').value='all';$('#search-state').value='all';focusDefault();render()});document.querySelectorAll('.tabs [data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;detailOpen=false;fitGraph=true;$('#search').value='';$('#search-type').value='all';$('#search-state').value='all';render()});bindRecords();document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{reviewFilter=b.dataset.review;render()});if($('#close-detail'))$('#close-detail').onclick=()=>{detailOpen=false;render()};if($('#show-context'))$('#show-context').onclick=()=>{view='graph';detailOpen=false;fitGraph=true;$('#search').value='';$('#search-type').value='all';$('#search-state').value='all';render()};if($('#copy-path'))$('#copy-path').onclick=async e=>{try{await navigator.clipboard.writeText(current().path);e.target.textContent='已複製'}catch{e.target.textContent='請選取上方位置'}};for(const [id,d] of [['zoom-out',-.15],['zoom-in',.15]])if($('#'+id))$('#'+id).onclick=()=>{fitGraph=false;scale=Math.max(.5,Math.min(1.6,scale+d));render()};if($('#zoom-reset'))$('#zoom-reset').onclick=()=>{fitGraph=false;scale=1;render()};if($('#zoom-fit'))$('#zoom-fit').onclick=()=>{fitGraph=true;render()};if($('#include-closed'))$('#include-closed').onchange=e=>{includeClosed=e.target.checked;fitGraph=true;render()}}
$('#search-toggle').onclick=()=>{searchOpen=!searchOpen;$('#search-panel').classList.toggle('hidden',!searchOpen);$('#search-toggle').setAttribute('aria-expanded',String(searchOpen));if(searchOpen)$('#search').focus();else{$('#search').value='';$('#search-type').value='all';$('#search-state').value='all';render()}};for(const id of ['search','search-type','search-state'])$('#'+id).addEventListener(id==='search'?'input':'change',render);for(const [id,label] of Object.entries(kinds)){const option=document.createElement('option');option.value=id;option.textContent=label;$('#search-type').append(option)}$('#generated').textContent='快照 '+formatStamp(data.generated);focusDefault();render();let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(view==='graph'){fitGraph=true;render()}},100)});
