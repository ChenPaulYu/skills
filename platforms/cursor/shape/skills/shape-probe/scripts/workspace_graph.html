  points=[[startX,portY],[laneX,portY],[laneX,endY],[endX,endY]];
  label={x:card.x+140,y:card.y+187};
 }else{
  // Relations between neighbors run around the outside, never through another card.
  const lane=14+outer*7,ay=a.y+82.5,by=b.y+82.5,aLeft=a.x<pos.get(root._key).x,bLeft=b.x<pos.get(root._key).x;
  const ax=aLeft?lane:width-lane,bx=bLeft?lane:width-lane;
  points=aLeft===bLeft?[[a.x+(aLeft?0:280),ay],[ax,ay],[bx,by],[b.x+(bLeft?0:280),by]]:[[a.x+(aLeft?0:280),ay],[ax,ay],[ax,20+outer*7],[bx,20+outer*7],[bx,by],[b.x+(bLeft?0:280),by]];outer++;
 }
 lines+=`<g><title>${esc(src._title)} → ${esc(dst._title)}: ${esc(e.relation)}</title><path class="edge ${label?'':'secondary'}" d="${rounded(points)}"/>${label?`<text class="edge-label" x="${label.x}" y="${label.y}" text-anchor="middle">${esc(relNames[e.relation]||e.relation)}</text>`:''}</g>`;
}
const nodes=[root,...left,...right].map(r=>{const a=pos.get(r._key);return `<g class="node ${r===root?'on':''}" data-record="${esc(r._key)}" tabindex="0" role="button" aria-label="${esc(r._title)}"><rect x="${a.x}" y="${a.y}" width="280" height="165" rx="14"/><foreignObject x="${a.x+16}" y="${a.y+14}" width="248" height="138"><div xmlns="http://www.w3.org/1999/xhtml" class="canvas-card ${typeof r.type==='string'?esc(r.type):''}"><div class="kind"><b>${esc(kinds[r.type]||'紀錄')}</b><span>${esc(state(r))}</span></div><h4>${esc(r._title)}</h4><p>${esc(opening(r).slice(0,200))}</p></div></foreignObject><title>${esc(r._title)}</title></g>`}).join('');return `<div class="canvas"><span class="map-note">局部脈絡 · ${pos.size} 份紀錄</span><div class="canvas-scroll" id="canvas-scroll"><svg class="graph" style="width:${width*scale}px" viewBox="0 0 ${width} ${height}" aria-label="可點選的工作脈絡">${lines}${nodes}</svg></div><div class="dock"><button id="zoom-out" aria-label="縮小">−</button><button id="zoom-reset">${Math.round(scale*100)}%</button><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-fit">適合視窗</button></div></div><div class="legend"><span>點選查看內容；線的方向與完整語意在詳情。</span><label><input id="include-closed" type="checkbox" ${includeClosed?'checked':''}>包含已結束</label></div>`}
function inline(text,owner){const slots=[];let s=String(text).replace(/`([^`]+)`/g,(_,code)=>{const i=slots.push('<code>'+esc(code)+'</code>')-1;return '\uE000'+i+'\uE001'});s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,target)=>{let html='<span class="local-link" title="'+esc(target)+'">'+esc(label)+'</span>';try{const url=new URL(target,'https://workspace.invalid/'+owner.path);if(url.hostname==='workspace.invalid'){const dest=byPath.get(decodeURIComponent(url.pathname.slice(1)));if(dest)html='<button class="local-link" data-record="'+esc(dest._key)+'">'+esc(label)+'</button>'}else if(['http:','https:'].includes(url.protocol))html='<a href="'+esc(url.href)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>'}catch{}const i=slots.push(html)-1;return '\uE000'+i+'\uE001'});return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\uE000(\d+)\uE001/g,(_,i)=>slots[Number(i)]||'')}
function markdown(text,owner){const lines=String(text).split('\n');let html='',i=0;while(i<lines.length){let l=lines[i];if(!l.trim()){i++;continue}if(/^```/.test(l)){let code=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))code.push(lines[i++]);i++;html+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';continue}const h=l.match(/^(#{1,6})\s+(.+)$/);if(h){const level=Math.min(5,h[1].length+1);html+=`<h${level}>${inline(h[2],owner)}</h${level}>`;i++;continue}if(/^\s*<!--/.test(l)){i++;continue}if(l.startsWith('|')&&i+1<lines.length&&/^\|[\s:|-]+\|/.test(lines[i+1])){const head=l.split('|').slice(1,-1);i+=2;let rows='';while(i<lines.length&&lines[i].startsWith('|'))rows+='<tr>'+lines[i++].split('|').slice(1,-1).map(c=>'<td>'+inline(c.trim(),owner)+'</td>').join('')+'</tr>';html+='<div class="table-wrap"><table><thead><tr>'+head.map(c=>'<th>'+inline(c.trim(),owner)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';continue}if(/^\s*[-*]\s+/.test(l)||/^\s*\d+\.\s+/.test(l)){const ordered=/^\s*\d+\./.test(l);let items='';const re=ordered?/^\s*\d+\.\s+/:/^\s*[-*]\s+/;while(i<lines.length&&re.test(lines[i]))items+='<li>'+inline(lines[i++].replace(re,''),owner)+'</li>';html+=(ordered?'<ol>':'<ul>')+items+(ordered?'</ol>':'</ul>');continue}if(l.startsWith('>')){html+='<blockquote>'+inline(l.replace(/^>\s?/,''),owner)+'</blockquote>';i++;continue}let paragraph=[l];i++;while(i<lines.length&&lines[i].trim()&&!/^(#|>|```|\s*[-*]\s+|\s*\d+\.\s+|\|)/.test(lines[i]))paragraph.push(lines[i++]);html+='<p>'+inline(paragraph.join(' '),owner)+'</p>'}return html}
function detail(){const r=current();if(!r)return;const body=String(r.body||''),obs=body.match(/^##\s+(?:Observations|觀察)[^\n]*\n([\s\S]*?)(?=^##\s|(?![\s\S]))/mi);const related=edges().filter(e=>e.source===r.id||e.target===r.id);$('#detail').innerHTML=`<div class="detail-head"><span class="kind">${esc(kinds[r.type]||'紀錄')} · ${esc(state(r))}</span><button id="close-detail" aria-label="關閉詳情">×</button></div><h2>${esc(r._title)}</h2><p class="lead">${esc(opening(r))}</p><div class="actions"><button class="btn" id="show-context">看工作脈絡</button></div>${obs?'<section class="observations"><h3>觀察到的現象</h3><div class="md">'+markdown(obs[1],r)+'</div></section>':''}<h3>關聯紀錄</h3>${related.map(e=>{const out=e.source===r.id,other=idRecord(out?e.target:e.source);return `<button class="relation" ${other?'data-record="'+esc(other._key)+'"':'disabled'}><small>${out?'→':'←'} ${esc(relNames[e.relation]||e.relation)}</small>${esc(other?other._title:String(out?e.target:e.source))}</button>`}).join('')||'<p class="quiet">尚未記錄關聯。</p>'}<details id="full-record"><summary>完整紀錄</summary><div class="md" id="record-body"></div></details><details><summary>來源與識別</summary><p class="source">${esc(r.path)}</p><p class="source">ID ${esc(typeof r.id==='string'?r.id:'待核對')}<br>建立 ${esc(r.metadata?.created||'未知')} · 更新 ${esc(r.metadata?.updated||'未知')}</p><button class="btn" id="copy-path">複製位置</button></details>`;$('#full-record').addEventListener('toggle',e=>{if(e.currentTarget.open&&!$('#record-body').hasChildNodes()){ $('#record-body').innerHTML=markdown(body,r);bindRecords($('#record-body'))}})}
function bindRecords(root=document){root.querySelectorAll('[data-record]').forEach(b=>{b.onclick=()=>choose(b.dataset.record);if(b.tagName.toLowerCase()==='g')b.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();choose(b.dataset.record)}}})}
function bind(){document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{project=b.dataset.project;view='now';detailOpen=false;scale=1;includeClosed=false;$('#search').value='';$('#search-type').value='all';$('#search-state').value='all';focusDefault();render()});document.querySelectorAll('.tabs [data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;detailOpen=false;$('#search').value='';$('#search-type').value='all';$('#search-state').value='all';render()});bindRecords();document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{reviewFilter=b.dataset.review;render()});if($('#close-detail'))$('#close-detail').onclick=()=>{detailOpen=false;render()};if($('#show-context'))$('#show-context').onclick=()=>{view='graph';detailOpen=false;$('#search').value='';$('#search-type').value='all';$('#search-state').value='all';render()};if($('#copy-path'))$('#copy-path').onclick=async e=>{try{await navigator.clipboard.writeText(current().path);e.target.textContent='已複製'}catch{e.target.textContent='請選取上方位置'}};for(const [id,d] of [['zoom-out',-.15],['zoom-in',.15]])if($('#'+id))$('#'+id).onclick=()=>{scale=Math.max(.5,Math.min(1.6,scale+d));render()};if($('#zoom-reset'))$('#zoom-reset').onclick=()=>{scale=1;render()};if($('#zoom-fit'))$('#zoom-fit').onclick=()=>{scale=Math.min(1,$('#canvas-scroll').clientWidth/$('#canvas-scroll svg').viewBox.baseVal.width);render()};if($('#include-closed'))$('#include-closed').onchange=e=>{includeClosed=e.target.checked;render()}}
$('#search-toggle').onclick=()=>{searchOpen=!searchOpen;$('#search-panel').classList.toggle('hidden',!searchOpen);$('#search-toggle').setAttribute('aria-expanded',String(searchOpen));if(searchOpen)$('#search').focus();else{$('#search').value='';$('#search-type').value='all';$('#search-state').value='all';render()}};for(const id of ['search','search-type','search-state'])$('#'+id).addEventListener(id==='search'?'input':'change',render);for(const [id,label] of Object.entries(kinds)){const option=document.createElement('option');option.value=id;option.textContent=label;$('#search-type').append(option)}$('#generated').textContent=data.generated.replace('T',' ').replace('+00:00',' UTC');focusDefault();render();
