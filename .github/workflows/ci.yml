name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/lib/*.test.mjs
      - run: node scripts/validate-codex-skills.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv run --no-project --python 3.12 --with pyyaml python -m unittest discover -s scripts/tests -v
